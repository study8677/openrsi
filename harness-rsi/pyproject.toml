[project]
name = "harness-rsi"
version = "0.1.0"
description = "OpenRSI Harness-RSI: Evolvable agent harnesses with deterministic sandbox verification"
requires-python = ">=3.12"
dependencies = [
    "compactbench>=0.3.0",
    "google-genai>=3.6.1",
    "harbor>=0.27.0",
    "matplotlib>=3.11.2",
    "openai>=3.57.0",
    "pydantic>=2.14.4",
    "pytest>=9.2.0",
    "pyyaml>=6.0.4",
    "rich>=15.0.0",
    "typer>=0.29.2",
]

[project.scripts]
openrsi = "evolver.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["evolver", "harness"]
