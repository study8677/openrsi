[project]
name = "model-rsi"
version = "0.1.0"
description = "OpenRSI Model-RSI: Recursive self-improvement for open-weight models via verifiable rollouts, STaR/DPO/GRPO post-training, frontier curriculum, and held-out gating"
requires-python = ">=3.11"
dependencies = [
    "compactbench>=0.3.0",
    "matplotlib>=3.9.0",
    "pydantic>=2.9.0",
    "pytest>=8.3.0",
    "pyyaml>=6.0.2",
    "rich>=13.9.0",
    "tiktoken>=0.8.0",
    "typer>=0.12.0",
]

[project.optional-dependencies]
train = [
    "torch>=2.4.0",
    "transformers>=4.46.0",
    "trl>=0.12.0",
    "peft>=0.13.0",
    "datasets>=3.0.0",
    "accelerate>=1.0.0",
]

[project.scripts]
model-rsi = "model_rsi.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["model_rsi"]
